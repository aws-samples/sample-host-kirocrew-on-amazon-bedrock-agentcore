<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="ar-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#7c3aed"/></marker>
    <marker id="ar-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
  </defs>
  <style>text{font-family:"Noto Sans SC","Droid Sans Fallback",sans-serif;}</style>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">KiroCrew on AgentCore：状态分层与同步（2026-09 现状）</text>
  <text x="600" y="62" font-size="13" text-anchor="middle" fill="#6b7280">三层自上而下：浏览器与控制面 → 每用户一台 microVM（临时）→ 持久层（S3 是唯一持久权威）</text>

  <!-- Layer 1: browser + control plane -->
  <rect x="60" y="84" width="1080" height="120" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4" rx="10"/>
  <text x="76" y="106" font-size="13" font-weight="bold" fill="#475569">① 浏览器与控制面</text>
  <rect x="90" y="120" width="250" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="215" y="146" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">KiroCrew SPA + 悬浮面板</text>
  <text x="215" y="168" font-size="12" text-anchor="middle" fill="#4b5563">前端 Shell 拦截回环调用并隧穿</text>
  <rect x="400" y="120" width="190" height="64" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="495" y="146" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Amazon Cognito</text>
  <text x="495" y="168" font-size="12" text-anchor="middle" fill="#4b5563">受限注册 / 登录（JWT）</text>
  <rect x="650" y="120" width="230" height="64" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="8"/>
  <text x="765" y="146" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Control Lambda</text>
  <text x="765" y="168" font-size="12" text-anchor="middle" fill="#4b5563">生命周期 · 租约 · 绑定令牌</text>
  <rect x="920" y="120" width="190" height="64" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="8"/>
  <text x="1015" y="146" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">DynamoDB</text>
  <text x="1015" y="168" font-size="12" text-anchor="middle" fill="#4b5563">状态机 · 代数指针 · 租约</text>
  <path d="M 590 152 L 650 152" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
  <path d="M 880 152 L 920 152" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#ar-orange)"/>

  <!-- Layer 2: microVM -->
  <rect x="60" y="232" width="1080" height="360" fill="#f0fdf4" stroke="#111827" stroke-width="2" stroke-dasharray="6,4" rx="10"/>
  <text x="76" y="256" font-size="14" font-weight="bold" fill="#111827">② AgentCore microVM（每用户一个沙盒，整机临时）</text>

  <rect x="90" y="280" width="200" height="60" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="190" y="304" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">协议适配器</text>
  <text x="190" y="326" font-size="12" text-anchor="middle" fill="#4b5563">校验信封 · 路由策略 · 隧道</text>

  <rect x="90" y="376" width="200" height="60" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="190" y="400" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">kirocrew gateway</text>
  <text x="190" y="422" font-size="12" text-anchor="middle" fill="#4b5563">上游原版 · 127.0.0.1:5476</text>

  <rect x="340" y="280" width="250" height="156" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="465" y="304" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">运行时（runtime）</text>
  <text x="352" y="330" font-size="12" fill="#4b5563">· supervisor：拉起 / 监管网关，</text>
  <text x="362" y="348" font-size="12" fill="#4b5563">  网关意外退出时自动重启</text>
  <text x="352" y="370" font-size="12" fill="#4b5563">· checkpoint 调度（见右侧触发点）</text>
  <text x="352" y="392" font-size="12" fill="#4b5563">· 冷启动 restore，之后标记 READY</text>
  <text x="352" y="414" font-size="12" fill="#4b5563">· 租约心跳 30s → 令牌可续签不轮换</text>

  <rect x="640" y="280" width="220" height="60" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="750" y="304" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">kiro-cli</text>
  <text x="750" y="326" font-size="12" text-anchor="middle" fill="#4b5563">设备码登录 PTY · whoami</text>

  <rect x="900" y="280" width="220" height="156" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="8"/>
  <text x="1010" y="304" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">checkpoint 触发点</text>
  <text x="912" y="328" font-size="12" fill="#78350f">1. Stop safely（最终，零丢失）</text>
  <text x="912" y="349" font-size="12" fill="#78350f">2. Kiro 登录 / 登出之后</text>
  <text x="912" y="370" font-size="12" fill="#78350f">3. 周期 300s，且工作区有变化</text>
  <text x="912" y="391" font-size="12" fill="#78350f">4. 后台任务由忙转闲</text>
  <text x="912" y="412" font-size="12" fill="#78350f">5. SIGTERM 优雅关闭（尽力）</text>
  <text x="1010" y="430" font-size="11" text-anchor="middle" fill="#92400e">任何非正常回收最多丢一个周期</text>

  <rect x="90" y="470" width="500" height="96" fill="#dcfce7" stroke="#059669" stroke-width="1.5" rx="8"/>
  <text x="340" y="496" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">/mnt/workspace —— 容器盘，临时</text>
  <text x="340" y="518" font-size="12" text-anchor="middle" fill="#4b5563">home/.kiro · home/.config · home/.local/share/kiro-cli · projects · user</text>
  <text x="340" y="540" font-size="12" text-anchor="middle" fill="#047857">会话结束即消失；每次冷启动从 S3 最新一代恢复（不再使用 managed session storage）</text>

  <rect x="640" y="470" width="220" height="96" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="8"/>
  <text x="750" y="496" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">本地暂存（可选）</text>
  <text x="750" y="518" font-size="12" text-anchor="middle" fill="#4b5563">/tmp/kirocrew-state</text>
  <text x="750" y="540" font-size="12" text-anchor="middle" fill="#4b5563">SQLite WAL 工作集，checkpoint 前回写</text>

  <!-- Layer 3: durable -->
  <rect x="60" y="620" width="1080" height="150" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" rx="10"/>
  <text x="1124" y="644" font-size="14" font-weight="bold" text-anchor="end" fill="#047857">③ 持久层 —— S3 加密 checkpoint 是唯一的持久权威</text>
  <rect x="200" y="664" width="260" height="80" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="8"/>
  <text x="330" y="692" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Persistence Broker Lambda</text>
  <text x="330" y="714" font-size="12" text-anchor="middle" fill="#4b5563">验绑定令牌 · 派生本沙盒 S3 key</text>
  <text x="330" y="732" font-size="12" text-anchor="middle" fill="#4b5563">签发短时预签名 URL · 记代数回执</text>
  <rect x="540" y="664" width="240" height="80" fill="#dcfce7" stroke="#059669" stroke-width="1.5" rx="8"/>
  <text x="660" y="692" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Amazon S3（部署者账户）</text>
  <text x="660" y="714" font-size="12" text-anchor="middle" fill="#4b5563">内容寻址加密 chunk + 加密 manifest</text>
  <text x="660" y="732" font-size="12" text-anchor="middle" fill="#4b5563">按代提交 · 保留最近两代 · 离线审计</text>
  <rect x="860" y="664" width="200" height="80" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="960" y="692" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">AWS KMS</text>
  <text x="960" y="714" font-size="12" text-anchor="middle" fill="#4b5563">每沙盒一把数据密钥</text>
  <text x="960" y="732" font-size="12" text-anchor="middle" fill="#4b5563">VM 内加密后才上传</text>

  <!-- Flows -->
  <line x1="190" y1="184" x2="190" y2="280" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ar-blue)"/>
  <text x="200" y="236" font-size="12" fill="#2563eb">协议信封 HTTP / SSE / WS</text>
  <path d="M 300 184 L 300 214 L 765 214 L 765 184" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#ar-orange)"/>
  <text x="532" y="208" font-size="12" text-anchor="middle" fill="#ea580c">Start / Stop safely / 令牌续签</text>
  <path d="M 580 280 L 580 226 L 1015 226 L 1015 184" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar-orange)"/>
  <text x="800" y="250" font-size="12" text-anchor="middle" fill="#ea580c">租约心跳 30s · READY / ERROR · 代数指针回执</text>
  <line x1="190" y1="340" x2="190" y2="376" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ar-blue)"/>
  <path d="M 340 406 L 290 406" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="315" y="398" font-size="11" text-anchor="middle" fill="#6b7280">监管</text>
  <line x1="190" y1="436" x2="190" y2="470" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="200" y="458" font-size="12" fill="#6b7280">读写</text>
  <path d="M 750 340 L 750 452 L 560 452 L 560 470" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="758" y="400" font-size="12" fill="#6b7280">写登录库 auth_kv</text>
  <path d="M 640 500 L 590 500" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="615" y="492" font-size="11" text-anchor="middle" fill="#6b7280">回写</text>

  <path d="M 330 566 L 330 664" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#ar-green)"/>
  <text x="318" y="608" font-size="12" text-anchor="end" fill="#047857">checkpoint 写：快照只冻结网关数秒，上传在后台完成</text>
  <path d="M 460 700 L 540 700" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#ar-green)"/>
  <text x="500" y="692" font-size="11" text-anchor="middle" fill="#047857">直传</text>
  <path d="M 660 664 L 660 600 L 520 600 L 520 566" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#ar-green)"/>
  <text x="672" y="604" font-size="12" fill="#047857">restore 读：逐 chunk 校验后原子换入</text>
  <path d="M 780 728 L 860 728" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
  <text x="820" y="720" font-size="11" text-anchor="middle" fill="#7c3aed">解封密钥</text>

  <!-- Legend -->
  <rect x="60" y="796" width="1080" height="80" fill="#f9fafb" stroke="#d1d5db" rx="6"/>
  <text x="76" y="818" font-size="12" font-weight="bold" fill="#374151">图例</text>
  <line x1="130" y1="838" x2="164" y2="838" stroke="#2563eb" stroke-width="2.2"/>
  <text x="172" y="842" font-size="12" fill="#374151">协议与数据流</text>
  <line x1="300" y1="838" x2="334" y2="838" stroke="#ea580c" stroke-width="2.2"/>
  <text x="342" y="842" font-size="12" fill="#374151">控制面 / 生命周期</text>
  <line x1="500" y1="838" x2="534" y2="838" stroke="#059669" stroke-width="2.2" stroke-dasharray="5,3"/>
  <text x="542" y="842" font-size="12" fill="#374151">checkpoint 写路径</text>
  <line x1="700" y1="838" x2="734" y2="838" stroke="#059669" stroke-width="2.2"/>
  <text x="742" y="842" font-size="12" fill="#374151">restore 读路径</text>
  <line x1="880" y1="838" x2="914" y2="838" stroke="#7c3aed" stroke-width="2"/>
  <text x="922" y="842" font-size="12" fill="#374151">身份 / 密钥</text>
  <line x1="1020" y1="838" x2="1054" y2="838" stroke="#6b7280" stroke-width="2"/>
  <text x="1062" y="842" font-size="12" fill="#374151">本地关系</text>
  <text x="130" y="866" font-size="11.5" fill="#6b7280">虚线框为信任 / 生命周期边界。沙盒内不持有任何 S3 凭证：一切存储操作凭绑定令牌向 Broker 换取一次性 URL。</text>
</svg>
