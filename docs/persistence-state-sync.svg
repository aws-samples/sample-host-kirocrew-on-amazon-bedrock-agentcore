  <path d="M 250 160 L 250 196 L 750 196 L 750 160" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#ar-orange)"/>
  <text x="500" y="190" font-size="12" text-anchor="middle" fill="#ea580c">启动 / 安全停止</text>
  <path d="M 860 130 L 910 130" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#ar-orange)"/>
  <path d="M 510 285 L 1005 285 L 1005 160" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar-orange)"/>
  <text x="760" y="278" font-size="12" text-anchor="middle" fill="#ea580c">租约 / 状态 / 代数指针</text>
