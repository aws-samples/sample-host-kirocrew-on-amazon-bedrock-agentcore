<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1000">
  <defs>
    <marker id="ar-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="ar-gy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
    <marker id="ar-gr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="ar-rd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#dc2626"/></marker>
  </defs>
  <style>text{font-family:"Noto Sans SC",sans-serif;}</style>
  <rect width="1160" height="1000" fill="#ffffff"/>
  <text x="580" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Kiro CLI 登录态持久化时序：持久路径 vs 丢失路径</text>
  <rect x="17" y="70" width="156" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="95" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">用户</text>
  <line x1="95" y1="112" x2="95" y2="950" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="202" y="70" width="156" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="280" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">面板 / SPA</text>
  <line x1="280" y1="112" x2="280" y2="950" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="397" y="70" width="156" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="475" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">适配器 identity</text>
  <line x1="475" y1="112" x2="475" y2="950" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="582" y="70" width="156" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="660" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">kiro-cli（PTY）</text>
  <line x1="660" y1="112" x2="660" y2="950" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="767" y="70" width="156" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="845" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">workspace auth_kv</text>
  <text x="845" y="106" font-size="8.5" text-anchor="middle" fill="#4b5563">home/.local/share/kiro-cli/data.sqlite3</text>
  <line x1="845" y1="112" x2="845" y2="950" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="967" y="70" width="156" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="1045" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">S3 checkpoint</text>
  <text x="1045" y="106" font-size="8.5" text-anchor="middle" fill="#4b5563">加密 chunk · 保留两代</text>
  <line x1="1045" y1="112" x2="1045" y2="950" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="40" y="132" width="700" height="330" fill="none" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <rect x="40" y="132" width="150" height="24" fill="#2563eb" rx="4"/>
  <text x="115" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">① 设备码登录</text>
  <line x1="95" y1="176" x2="280" y2="176" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="187" y="169" font-size="12" text-anchor="middle" fill="#2563eb">点击 Kiro 登录</text>
  <line x1="280" y1="216" x2="475" y2="216" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="377" y="209" font-size="12" text-anchor="middle" fill="#2563eb">kiro.login.start</text>
  <line x1="475" y1="256" x2="660" y2="256" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="567" y="249" font-size="12" text-anchor="middle" fill="#2563eb">spawn PTY：kiro-cli login --use-device-flow</text>
  <line x1="660" y1="296" x2="280" y2="296" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ar-gy)"/>
  <text x="470" y="289" font-size="12" text-anchor="middle" fill="#6b7280">设备码 + 验证链接（SSE 事件）</text>
  <path d="M 95 330 L 135 330 L 135 352 L 103 352" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="145" y="346" font-size="12" text-anchor="start" fill="#2563eb">在自己浏览器完成设备授权（Builder ID / SSO）</text>
  <line x1="660" y1="396" x2="845" y2="396" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-gr)"/>
  <text x="752" y="389" font-size="12" text-anchor="middle" fill="#059669">登录成功：写 auth_kv（registration + token）</text>
  <line x1="475" y1="436" x2="280" y2="436" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ar-gy)"/>
  <text x="377" y="429" font-size="12" text-anchor="middle" fill="#6b7280">kiro.authenticated</text>
  <rect x="40" y="486" width="1080" height="220" fill="none" stroke="#059669" stroke-width="1.5" rx="4"/>
  <rect x="40" y="486" width="150" height="24" fill="#059669" rx="4"/>
  <text x="115" y="502" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">② 路径 A：Stop safely</text>
  <line x1="95" y1="530" x2="280" y2="530" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="187" y="523" font-size="12" text-anchor="middle" fill="#2563eb">Stop safely</text>
  <line x1="280" y1="570" x2="475" y2="570" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="377" y="563" font-size="12" text-anchor="middle" fill="#2563eb">sandbox.prepare_stop</text>
  <line x1="475" y1="610" x2="1045" y2="610" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-gr)"/>
  <text x="760" y="603" font-size="12" text-anchor="middle" fill="#059669">checkpoint gen N+1（登录库 data.sqlite3 已入 manifest）</text>
  <line x1="1045" y1="650" x2="845" y2="650" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-gr)"/>
  <text x="945" y="643" font-size="12" text-anchor="middle" fill="#059669">（重启后）restore gen N+1 → auth_kv 完整</text>
  <line x1="660" y1="686" x2="280" y2="686" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ar-gr)"/>
  <text x="470" y="679" font-size="12" text-anchor="middle" fill="#059669">whoami → 已登录 ✓</text>
  <rect x="40" y="730" width="1080" height="236" fill="none" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <rect x="40" y="730" width="150" height="24" fill="#dc2626" rx="4"/>
  <text x="115" y="746" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">③ 路径 B：闲置回收（缺陷）</text>
  <rect x="320" y="748" width="520" height="58" fill="#fef9c3" stroke="#ca8a04" rx="4"/>
  <text x="332" y="768" font-size="11.5" fill="#713f12">登录后 15 分钟无请求，AgentCore 缩容回收 microVM —— 没有任何 checkpoint。</text>
  <text x="332" y="786" font-size="11.5" fill="#713f12">managed session storage 随后过期；期间发生的登录写入只存在于该挂载上。</text>
  <line x1="1045" y1="848" x2="845" y2="848" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-rd)"/>
  <text x="945" y="841" font-size="12" text-anchor="middle" fill="#dc2626">restore gen N（登录之前的最后一次 Stop safely）</text>
  <line x1="845" y1="888" x2="660" y2="888" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-rd)"/>
  <text x="752" y="881" font-size="12" text-anchor="middle" fill="#dc2626">auth_kv 被整树替换回滚，登录态消失</text>
  <line x1="660" y1="926" x2="280" y2="926" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ar-rd)"/>
  <text x="470" y="919" font-size="12" text-anchor="middle" fill="#dc2626">whoami → 未登录 ×，必须重新登录</text>
</svg>