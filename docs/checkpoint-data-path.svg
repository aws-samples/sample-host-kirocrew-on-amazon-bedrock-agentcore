<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900">
  <defs>
    <marker id="m-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="m-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
    <marker id="m-gr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="m-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
  </defs>
  <style>text{font-family:"Noto Sans SC",sans-serif;}</style>
  <rect width="1120" height="900" fill="#ffffff"/>
  <text x="560" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">备份数据通路：数据 VM 直连 S3，Lambda 只发钥匙和记账</text>
  <rect x="28" y="64" width="184" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="120" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">checkpoint 触发源</text>
  <text x="120" y="102" font-size="9.5" text-anchor="middle" fill="#4b5563">登录/登出·周期·SIGTERM·Stop</text>
  <line x1="120" y1="110" x2="120" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="268" y="64" width="184" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="360" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">沙盒 runtime</text>
  <text x="360" y="102" font-size="9.5" text-anchor="middle" fill="#4b5563">CheckpointEngine（microVM 内）</text>
  <line x1="360" y1="110" x2="360" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="518" y="64" width="184" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="610" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Broker Lambda</text>
  <text x="610" y="102" font-size="9.5" text-anchor="middle" fill="#4b5563">授权门卫</text>
  <line x1="610" y1="110" x2="610" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="738" y="64" width="184" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="830" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">S3 checkpoint 桶</text>
  <text x="830" y="102" font-size="9.5" text-anchor="middle" fill="#4b5563">我们账户内</text>
  <line x1="830" y1="110" x2="830" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="928" y="64" width="184" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="1020" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">DynamoDB</text>
  <text x="1020" y="102" font-size="9.5" text-anchor="middle" fill="#4b5563">代数指针</text>
  <line x1="1020" y1="110" x2="1020" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="160" x2="360" y2="160" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m-g)"/>
  <text x="240" y="153" font-size="12" text-anchor="middle" fill="#6b7280">触发 checkpoint</text>
  <rect x="400" y="180" width="340" height="56" fill="#dbeafe" stroke="#2563eb" rx="4"/>
  <text x="412" y="199" font-size="11.5" fill="#1e3a8a">① SIGSTOP 静默 KiroCrew/Kiro 进程组</text>
  <text x="412" y="216" font-size="11.5" fill="#1e3a8a">② /tmp WAL 暂存态回写 workspace + os.sync</text>
  <text x="412" y="233" font-size="11.5" fill="#1e3a8a">③ 按 PersistencePolicy 构建确定性 manifest</text>
  <line x1="360" y1="280" x2="610" y2="280" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-o)"/>
  <text x="485" y="273" font-size="12" text-anchor="middle" fill="#ea580c">请求沙盒数据密钥（附 binding token）</text>
  <line x1="610" y1="320" x2="360" y2="320" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#m-o)"/>
  <text x="485" y="313" font-size="12" text-anchor="middle" fill="#ea580c">KMS 按加密上下文解封 → 数据密钥</text>
  <rect x="400" y="344" width="300" height="40" fill="#dbeafe" stroke="#2563eb" rx="4"/>
  <text x="412" y="363" font-size="11.5" fill="#1e3a8a">④ VM 内 AES-256-GCM 加密所有新 chunk</text>
  <text x="412" y="380" font-size="11.5" fill="#1e3a8a">（内容寻址，已存在的跳过）</text>
  <line x1="360" y1="430" x2="610" y2="430" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-o)"/>
  <text x="485" y="423" font-size="12" text-anchor="middle" fill="#ea580c">presign：请求上传 URL</text>
  <line x1="610" y1="470" x2="360" y2="470" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#m-o)"/>
  <text x="485" y="463" font-size="12" text-anchor="middle" fill="#ea580c">预签名 URL ≤5min（key 由 broker 派生，限本沙盒前缀）</text>
  <line x1="360" y1="540" x2="830" y2="540" stroke="#059669" stroke-width="3" marker-end="url(#m-gr)"/>
  <text x="595" y="533" font-size="12" text-anchor="middle" fill="#059669">PUT 加密 chunk + manifest（直连，不经 Lambda）</text>
  <line x1="360" y1="600" x2="830" y2="600" stroke="#059669" stroke-width="1.8" marker-end="url(#m-gr)"/>
  <text x="595" y="593" font-size="12" text-anchor="middle" fill="#059669">PUT commits/N.json —— 权威提交点</text>
  <line x1="360" y1="660" x2="610" y2="660" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-o)"/>
  <text x="485" y="653" font-size="12" text-anchor="middle" fill="#ea580c">checkpointReceipt(N, digest, final)</text>
  <line x1="610" y1="700" x2="1020" y2="700" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-o)"/>
  <text x="815" y="693" font-size="12" text-anchor="middle" fill="#ea580c">事务：推进代数指针（仅 final 置 STOPPING）</text>
  <line x1="610" y1="740" x2="360" y2="740" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#m-o)"/>
  <text x="485" y="733" font-size="12" text-anchor="middle" fill="#ea580c">KMS 签名回执</text>
  <rect x="400" y="770" width="620" height="66" fill="#f9fafb" stroke="#d1d5db" rx="4"/>
  <text x="412" y="789" font-size="11.5" fill="#374151">失败语义：任何一步失败 → 本代不生效，上一已提交代仍是权威；非 final 时进程组恢复运行。</text>
  <text x="412" y="806" font-size="11.5" fill="#374151">后台提交可能 S3 成功而回执未落（进程被回收）——restore 容忍 S3 超前指针，只有落后才判数据丢失。</text>
  <text x="412" y="823" font-size="11.5" fill="#374151">恢复路径对称：restore 用预签名 GET 直连拉取 chunk，逐一校验摘要后原子换入。</text>
  <rect x="770" y="146" width="330" height="52" fill="#f0fdf4" stroke="#059669" rx="6"/>
  <text x="784" y="166" font-size="12" font-weight="bold" fill="#059669">图例</text>
  <line x1="784" y1="182" x2="818" y2="182" stroke="#059669" stroke-width="3"/><text x="826" y="186" font-size="11.5" fill="#374151">数据流（密文）</text>
  <line x1="940" y1="182" x2="974" y2="182" stroke="#ea580c" stroke-width="1.8"/><text x="982" y="186" font-size="11.5" fill="#374151">授权/记账</text>
</svg>