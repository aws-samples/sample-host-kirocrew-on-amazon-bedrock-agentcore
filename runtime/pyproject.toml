[project]
name = "kirocrew-agentcore-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.21",
  "kirocrew @ https://download.crew.kiro.dev/cli/stable/0.5.0/kirocrew-0.5.0-py3-none-any.whl#sha256=48a722da4a1957b3962e42b675c83c19a4b898bca0d54af81a6305c4dd915d57",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kirocrew_agentcore_runtime"]
