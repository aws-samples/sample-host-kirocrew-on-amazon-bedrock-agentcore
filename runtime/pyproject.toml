[project]
name = "kirocrew-agentcore-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.21",
  "kirocrew @ https://download.crew.kiro.dev/cli/stable/0.13.0/kirocrew-0.13.0-py3-none-any.whl#sha256=cd3648579e066e1266ee72e65b111de0e293ff0df18ee850f803d2db616017e5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kirocrew_agentcore_runtime"]
