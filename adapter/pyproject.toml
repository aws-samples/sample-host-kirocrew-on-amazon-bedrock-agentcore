[project]
name = "kirocrew-agentcore-adapter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.3",
  "cryptography>=47,<48",
  "jsonschema[format]==4.25.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirocrew_agentcore_adapter"]
