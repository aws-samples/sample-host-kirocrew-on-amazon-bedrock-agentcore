  <text x="530" y="677" font-size="11" text-anchor="middle" fill="#4b5563">预签名 URL ≤15min · 派生 S3 key</text>
  <rect x="710" y="630" width="190" height="70" fill="#dcfce7" stroke="#059669" stroke-width="1.5" rx="8"/>
  <text x="805" y="657" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Amazon S3</text>
  <text x="805" y="677" font-size="11" text-anchor="middle" fill="#4b5563">加密 chunk + manifest · 保留两代</text>
  <rect x="950" y="630" width="150" height="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="1025" y="657" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">AWS KMS</text>
  <text x="1025" y="677" font-size="11" text-anchor="middle" fill="#4b5563">每沙盒数据密钥</text>
  <line x1="190" y1="160" x2="190" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
