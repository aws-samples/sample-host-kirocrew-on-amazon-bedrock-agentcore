[project]
name = "kirocrew-agentcore-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.21",
  "kirocrew @ https://download.crew.kiro.dev/cli/stable/0.7.2/kirocrew-0.7.2-py3-none-any.whl#sha256=ba966c8b2263a211d01c2630f6e0ec22efac746d0c9d2e16eea0fa90dc2ecc3a",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kirocrew_agentcore_runtime"]
