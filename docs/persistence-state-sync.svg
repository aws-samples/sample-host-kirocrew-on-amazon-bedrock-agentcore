  <text x="190" y="379" font-size="11" text-anchor="middle" fill="#4b5563">127.0.0.1:5476</text>
  <rect x="320" y="356" width="190" height="54" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="415" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">kiro-cli</text>
  <text x="415" y="395" font-size="11" text-anchor="middle" fill="#4b5563">登录 PTY / whoami</text>
  <rect x="100" y="440" width="410" height="86" fill="#dcfce7" stroke="#059669" stroke-width="1.5" rx="8"/>
  <text x="305" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">/mnt/workspace（唯一可写挂载）</text>
  <text x="305" y="495" font-size="11" text-anchor="middle" fill="#4b5563">home/.kiro · home/.config · home/.local/share/kiro-cli · projects · user</text>
  <rect x="545" y="440" width="165" height="86" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="8"/>
  <text x="627" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">本地暂存</text>
  <text x="627" y="495" font-size="11" text-anchor="middle" fill="#4b5563">/tmp/kirocrew-state WAL 工作集</text>
  <rect x="70" y="590" width="1060" height="150" fill="none" stroke="#059669" stroke-dasharray="6,4" rx="8"/>
  <text x="84" y="612" font-size="13" fill="#059669">持久层（S3 为唯一持久权威）</text>
  <rect x="100" y="630" width="250" height="70" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" rx="8"/>
  <text x="225" y="657" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Managed Session Storage</text>
  <text x="225" y="677" font-size="11" text-anchor="middle" fill="#4b5563">加速层 · 会过期 · 无持久承诺</text>
  <rect x="410" y="630" width="240" height="70" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="8"/>
