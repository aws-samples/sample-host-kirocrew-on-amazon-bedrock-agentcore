<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#374151"/></marker>
    <marker id="ar-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#dc2626"/></marker>
    <marker id="ar-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
  </defs>
  <style>text{font-family:"Noto Sans SC","Droid Sans Fallback",sans-serif;}</style>
  <rect width="1000" height="1000" fill="#ffffff"/>
  <text x="500" y="36" font-size="21" font-weight="bold" text-anchor="middle" fill="#111827">沙盒冷启动 / 恢复决策流程</text>
  <text x="500" y="60" font-size="13" text-anchor="middle" fill="#6b7280">容器盘每次冷启动都是空的，因此老沙盒总是从 S3 恢复；同一会话内的热恢复不重跑此流程</text>

  <!-- start -->
  <rect x="390" y="84" width="220" height="42" fill="#dcfce7" stroke="#059669" stroke-width="2" rx="21"/>
  <text x="500" y="111" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">新会话的首次调用到达</text>

  <!-- step 1 -->
  <rect x="330" y="156" width="340" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="500" y="180" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#111827">① 读 DynamoDB 沙盒记录</text>
  <text x="500" y="200" font-size="12" text-anchor="middle" fill="#4b5563">校验 runtimeSessionId 一致 · 读最新已提交代数</text>

  <!-- step 2 -->
  <rect x="330" y="242" width="340" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="500" y="266" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#111827">② 抢占初始化租约（90s，每 20s 心跳）</text>
  <text x="500" y="286" font-size="12" text-anchor="middle" fill="#4b5563">别处正在初始化 → 本容器退出，让平台重新调度</text>

  <!-- decision: existing sandbox? -->
  <path d="M 500 332 L 640 372 L 500 412 L 360 372 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="500" y="377" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">记录里有历史代数？</text>

  <!-- new sandbox branch (right) -->
  <rect x="720" y="350" width="230" height="44" fill="#dcfce7" stroke="#059669" stroke-width="2" rx="22"/>
  <text x="835" y="377" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">新沙盒：初始化空工作区</text>

  <!-- decision: S3 has committed gen -->
  <path d="M 500 446 L 640 486 L 500 526 L 360 486 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="500" y="482" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">S3 中有 ≥ 指针的</text>
  <text x="500" y="500" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">已提交代数？</text>

  <!-- restore latest -->
  <rect x="330" y="566" width="340" height="66" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="500" y="590" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#111827">③ 恢复最新代 N</text>
  <text x="500" y="609" font-size="12" text-anchor="middle" fill="#4b5563">并行预取 chunk → 逐块校验摘要 → 隔离暂存树 → 原子换入</text>
  <text x="500" y="625" font-size="12" text-anchor="middle" fill="#4b5563">被现行策略排除的历史条目（如嵌入模型）直接跳过</text>

  <!-- decision: success -->
  <path d="M 500 664 L 600 700 L 500 736 L 400 700 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="500" y="705" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">校验通过？</text>

  <!-- fallback -->
  <rect x="90" y="666" width="230" height="68" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="8"/>
  <text x="205" y="690" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">回退前一代 N−1</text>
  <text x="205" y="709" font-size="12" text-anchor="middle" fill="#4b5563">只回退一次，同样全量校验</text>
  <text x="205" y="725" font-size="12" text-anchor="middle" fill="#4b5563">回退成功也进入 ④</text>

  <!-- step 4 -->
  <rect x="330" y="776" width="340" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="500" y="800" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#111827">④ 启动 kirocrew gateway</text>
  <text x="500" y="820" font-size="12" text-anchor="middle" fill="#4b5563">等就绪行或健康探测；钉住 loop-stall 预算；开始租约心跳</text>

  <!-- ready -->
  <rect x="390" y="864" width="220" height="42" fill="#dcfce7" stroke="#059669" stroke-width="2" rx="21"/>
  <text x="500" y="891" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">标记 READY，开始服务</text>

  <!-- error -->
  <rect x="40" y="864" width="300" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="21"/>
  <text x="190" y="891" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">ERROR：PERSISTENCE_RESTORE_FAILED</text>
  <text x="190" y="928" font-size="11.5" text-anchor="middle" fill="#6b7280">面板显示 Start sandbox，可直接重试</text>

  <!-- side note -->
  <rect x="720" y="560" width="230" height="140" fill="#f9fafb" stroke="#d1d5db" rx="6"/>
  <text x="732" y="584" font-size="12.5" font-weight="bold" fill="#111827">为什么老沙盒总是恢复</text>
  <text x="732" y="606" font-size="11.5" fill="#4b5563">· 工作区在容器盘上，冷启动时为空</text>
  <text x="732" y="626" font-size="11.5" fill="#4b5563">· 没有托管 session storage 可"命中"</text>
  <text x="732" y="646" font-size="11.5" fill="#4b5563">· 小工作区恢复只需数秒</text>
  <text x="732" y="666" font-size="11.5" fill="#4b5563">· 后台提交后进程若被回收，S3 会领先</text>
  <text x="732" y="684" font-size="11.5" fill="#4b5563">  DynamoDB 指针；恢复总是取 S3 最新代</text>

  <!-- edges -->
  <path d="M 500 126 L 500 156" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 500 212 L 500 242" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 500 298 L 500 332" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 500 412 L 500 446" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="512" y="434" font-size="12.5" font-weight="bold" fill="#374151">是</text>
  <path d="M 640 372 L 720 372" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="680" y="364" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#374151">否</text>
  <path d="M 835 394 L 835 536 L 690 536 L 690 804 L 670 804" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <text x="700" y="560" font-size="11.5" fill="#6b7280">无需恢复</text>
  <path d="M 500 526 L 500 566" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="512" y="550" font-size="12.5" font-weight="bold" fill="#374151">是</text>
  <path d="M 360 486 L 72 486 L 72 864" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-r)"/>
  <text x="216" y="478" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#dc2626">否：有历史却无可用代</text>
  <path d="M 500 736 L 500 776" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="512" y="760" font-size="12.5" font-weight="bold" fill="#059669">是</text>
  <path d="M 400 700 L 320 700" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#ar-o)"/>
  <text x="360" y="692" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ea580c">否</text>
  <path d="M 205 734 L 205 804 L 330 804" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="214" y="790" font-size="12" font-weight="bold" fill="#059669">N−1 通过</text>
  <path d="M 130 734 L 130 864" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-r)"/>
  <text x="66" y="804" font-size="12" font-weight="bold" fill="#dc2626">两代皆失败</text>
  <path d="M 500 832 L 500 864" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- legend -->
  <rect x="60" y="948" width="880" height="40" fill="#f9fafb" stroke="#d1d5db" rx="6"/>
  <rect x="76" y="960" width="18" height="16" fill="#eff6ff" stroke="#2563eb"/><text x="100" y="973" font-size="12" fill="#374151">步骤</text>
  <path d="M 180 968 L 200 960 L 220 968 L 200 976 Z" fill="#fef9c3" stroke="#ca8a04"/><text x="228" y="973" font-size="12" fill="#374151">判断</text>
  <rect x="300" y="960" width="18" height="16" fill="#dcfce7" stroke="#059669" rx="8"/><text x="324" y="973" font-size="12" fill="#374151">正常终点</text>
  <rect x="420" y="960" width="18" height="16" fill="#fee2e2" stroke="#dc2626" rx="8"/><text x="444" y="973" font-size="12" fill="#374151">失败终点</text>
  <line x1="540" y1="968" x2="574" y2="968" stroke="#374151" stroke-width="2" stroke-dasharray="4,3"/><text x="582" y="973" font-size="12" fill="#374151">跳过恢复的路径</text>
  <text x="720" y="973" font-size="12" fill="#374151">实现：AwsSessionInitializer · RestoreEngine</text>
</svg>
