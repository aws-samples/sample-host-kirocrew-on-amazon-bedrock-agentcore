  <line x1="415" y1="330" x2="415" y2="356" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-gray)"/>
  <line x1="190" y1="394" x2="190" y2="440" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="196" y="422" font-size="12" text-anchor="start" fill="#6b7280">读写</text>
  <line x1="510" y1="470" x2="545" y2="470" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
  <line x1="545" y1="500" x2="510" y2="500" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
  <text x="527" y="462" font-size="12" text-anchor="middle" fill="#2563eb">镜像</text>
  <text x="527" y="518" font-size="12" text-anchor="middle" fill="#2563eb">回写</text>
  <line x1="225" y1="526" x2="225" y2="630" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="232" y="585" font-size="12" text-anchor="start" fill="#6b7280">同一挂载的本地加速层</text>
  <path d="M 510 300 L 745 300 L 745 570 L 630 570 L 630 630" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar-green)"/>
  <text x="753" y="440" font-size="12" text-anchor="start" fill="#059669">checkpoint：加密 chunk / manifest 上传</text>
  <path d="M 650 650 L 710 650" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar-green)"/>
  <path d="M 710 685 L 672 685" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>
  <path d="M 590 630 L 590 600 L 560 600 L 560 545 L 385 545 L 385 526" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>
  <text x="596" y="590" font-size="12" text-anchor="start" fill="#059669">restore：校验后原子换入 workspace</text>
  <path d="M 530 700 L 530 722 L 1025 722 L 1025 700" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
  <text x="790" y="736" font-size="12" text-anchor="middle" fill="#7c3aed">解封数据密钥（含加密上下文）</text>
  <path d="M 580 130 L 640 130" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
  <rect x="740" y="762" width="390" height="86" fill="#f9fafb" stroke="#d1d5db" rx="6"/>
  <line x1="756" y1="782" x2="786" y2="782" stroke="#2563eb" stroke-width="2"/>
  <text x="794" y="786" font-size="12" fill="#374151">协议与数据流</text>
  <line x1="952" y1="782" x2="982" y2="782" stroke="#ea580c" stroke-width="2"/>
  <text x="990" y="786" font-size="12" fill="#374151">控制面 / 生命周期</text>
  <line x1="756" y1="804" x2="786" y2="804" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="794" y="808" font-size="12" fill="#374151">checkpoint 写路径</text>
  <line x1="952" y1="804" x2="982" y2="804" stroke="#059669" stroke-width="2"/>
  <text x="990" y="808" font-size="12" fill="#374151">restore 读路径</text>
  <line x1="756" y1="826" x2="786" y2="826" stroke="#7c3aed" stroke-width="2"/>
  <text x="794" y="830" font-size="12" fill="#374151">身份 / 密钥</text>
  <line x1="952" y1="826" x2="982" y2="826" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="990" y="830" font-size="12" fill="#374151">本地关系</text>
</svg>