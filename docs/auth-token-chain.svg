  <text x="870" y="616" font-size="11.5" text-anchor="middle" fill="#4b5563">adapter：KMS 验签 binding token，核对 JWT subject 绑定</text>
  
  <rect x="36" y="652" width="1100" height="120" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="7,4" rx="4"/>
