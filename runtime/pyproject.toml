[project]
name = "kirocrew-agentcore-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.21",
  "kirocrew[voice-aws] @ https://download.crew.kiro.dev/cli/stable/0.13.1/kirocrew-0.13.1-py3-none-any.whl#sha256=916f49de2a8cd261d0ae79edc8f9ad125069f159da70659a8ee95b241b804f80",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kirocrew_agentcore_runtime"]
