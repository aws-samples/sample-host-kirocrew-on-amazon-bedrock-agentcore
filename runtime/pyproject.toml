[project]
name = "kirocrew-agentcore-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.21",
  "kirocrew @ https://download.crew.kiro.dev/cli/stable/0.12.2/kirocrew-0.12.2-py3-none-any.whl#sha256=9bd7e2a80fe413bcd9d1939747aa56b8ae031cd17a2438bf9e014768fdb0b7a8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kirocrew_agentcore_runtime"]
