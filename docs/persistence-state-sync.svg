<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860">
  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="ar-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#7c3aed"/></marker>
    <marker id="ar-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
  </defs>
  <style>text{font-family:"Noto Sans SC",sans-serif;}</style>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">KiroCrew on AgentCore 持久化状态分层与同步架构</text>
  <rect x="70" y="70" width="1060" height="110" fill="none" stroke="#9ca3af" stroke-dasharray="6,4" rx="8"/>
  <text x="84" y="92" font-size="13" fill="#6b7280">浏览器与控制面</text>
  <rect x="100" y="100" width="240" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="220" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">KiroCrew SPA + 悬浮面板</text>
  <text x="220" y="142" font-size="11" text-anchor="middle" fill="#4b5563">前端 Shell 拦截回环调用</text>
  <rect x="400" y="100" width="180" height="60" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="490" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Amazon Cognito</text>
  <text x="490" y="142" font-size="11" text-anchor="middle" fill="#4b5563">PKCE 用户登录</text>
  <rect x="640" y="100" width="220" height="60" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="8"/>
  <text x="750" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Control Lambda</text>
  <text x="750" y="142" font-size="11" text-anchor="middle" fill="#4b5563">生命周期 / 租约 / 绑定令牌</text>
  <rect x="910" y="100" width="190" height="60" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="8"/>
  <text x="1005" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DynamoDB</text>
  <text x="1005" y="142" font-size="11" text-anchor="middle" fill="#4b5563">状态机 / 代数指针 / init 属主</text>
  <rect x="70" y="220" width="660" height="330" fill="#f0fdf4" stroke="#111827" stroke-width="2" stroke-dasharray="6,4" rx="10"/>
  <text x="330" y="244" font-size="14" font-weight="bold" fill="#111827">AgentCore microVM（每用户一个沙盒）</text>
  <rect x="100" y="260" width="180" height="54" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="190" y="279" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">协议适配器</text>
  <text x="190" y="299" font-size="11" text-anchor="middle" fill="#4b5563">校验信封 / 路由策略</text>
  <rect x="320" y="260" width="190" height="70" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="415" y="287" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">运行时</text>
  <text x="415" y="307" font-size="11" text-anchor="middle" fill="#4b5563">supervisor · checkpoint · restore</text>
  <rect x="100" y="340" width="180" height="54" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="8"/>
