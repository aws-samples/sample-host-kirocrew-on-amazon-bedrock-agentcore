<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1000">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#374151"/></marker>
    <marker id="ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#dc2626"/></marker>
  </defs>
  <style>text{font-family:"Noto Sans SC",sans-serif;}</style>
  <rect width="980" height="1000" fill="#ffffff"/>
  <text x="490" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">checkpoint 提交流程（CheckpointEngine，当前唯一触发点：Stop safely）</text>
  <rect x="155" y="78" width="470" height="44" fill="#dcfce7" stroke="#059669" stroke-width="2" rx="22"/>
  <text x="390" y="105" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">用户点 Stop safely → sandbox.prepare_stop</text>
  <rect x="155" y="150" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="177" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">取 checkpoint 锁，gen = 最新提交代数 + 1</text>
  <text x="390" y="196" font-size="11" text-anchor="middle" fill="#4b5563">asyncio.Lock 串行化，代数单调递增</text>
  <path d="M 390 122 L 390 150" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="232" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="259" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">静默：SIGSTOP 暂停 KiroCrew / Kiro 进程组</text>
  <text x="390" y="278" font-size="11" text-anchor="middle" fill="#4b5563">quiesced —— 捕获窗口内不再有并发写</text>
  <path d="M 390 210 L 390 232" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="314" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="341" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">回写暂存态 + 落盘</text>
  <text x="390" y="360" font-size="11" text-anchor="middle" fill="#4b5563">StagedStateFlusher：/tmp WAL 工作集镜像回 workspace，再 os.sync</text>
  <path d="M 390 292 L 390 314" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="396" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="423" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">按 PersistencePolicy 构建确定性 manifest</text>
  <text x="390" y="442" font-size="11" text-anchor="middle" fill="#4b5563">含 home/.local/share/kiro-cli 登录库；排除 .aws/.ssh/缓存等</text>
  <path d="M 390 374 L 390 396" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="478" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="505" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">加密上传新 chunk</text>
  <text x="390" y="524" font-size="11" text-anchor="middle" fill="#4b5563">AES-256-GCM · 内容寻址去重，已存在的 chunk 跳过</text>
  <path d="M 390 456 L 390 478" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="560" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="587" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">加密上传 manifest</text>
  <text x="390" y="606" font-size="11" text-anchor="middle" fill="#4b5563">manifest 本身也用沙盒数据密钥加密</text>
  <path d="M 390 538 L 390 560" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="642" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="669" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">条件提交代数 gen</text>
  <text x="390" y="688" font-size="11" text-anchor="middle" fill="#4b5563">S3 权威提交点：此后该代不可变</text>
  <path d="M 390 620 L 390 642" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="724" width="470" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="390" y="751" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">写本地指针 + 清 dirty journal</text>
  <text x="390" y="770" font-size="11" text-anchor="middle" fill="#4b5563">.agentcore/persistence.json；快照后的新写留给下一代</text>
  <path d="M 390 702 L 390 724" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="816" width="470" height="44" fill="#dcfce7" stroke="#059669" stroke-width="2" rx="22"/>
  <text x="390" y="843" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">checkpoint.committed 回执 → 控制面置 STOPPING</text>
  <path d="M 390 784 L 390 816" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="700" y="150" width="250" height="180" fill="#fef2f2" stroke="#dc2626" rx="8"/>
  <text x="716" y="176" font-size="13" font-weight="bold" fill="#dc2626">失败语义</text>
  <text x="716" y="200" font-size="11.5" fill="#7f1d1d">任何一步失败：</text>
  <text x="716" y="221" font-size="11.5" fill="#7f1d1d">· 本次代数不生效</text>
  <text x="716" y="242" font-size="11.5" fill="#7f1d1d">· 上一已提交代仍是权威</text>
  <text x="716" y="263" font-size="11.5" fill="#7f1d1d">· 非 final 或未完成时恢复进程</text>
  <text x="716" y="284" font-size="11.5" fill="#7f1d1d">· prepare_stop 失败报</text>
  <text x="716" y="305" font-size="11.5" fill="#7f1d1d">  CHECKPOINT_FAILED（可重试）</text>
  <line x1="700" y1="240" x2="628" y2="262" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="700" y="470" width="250" height="150" fill="#f0fdf4" stroke="#059669" rx="8"/>
  <text x="716" y="496" font-size="13" font-weight="bold" fill="#059669">传输与密钥边界</text>
  <text x="716" y="520" font-size="11.5" fill="#14532d">上传经 Persistence Broker：</text>
  <text x="716" y="541" font-size="11.5" fill="#14532d">· 预签名 URL ≤ 15 分钟</text>
  <text x="716" y="562" font-size="11.5" fill="#14532d">· S3 key 由 broker 派生</text>
  <text x="716" y="583" font-size="11.5" fill="#14532d">· KMS 加密上下文绑定沙盒 ID</text>
  <text x="716" y="604" font-size="11.5" fill="#14532d">· 运行时不可 list、不见桶前缀</text>
  <line x1="700" y1="545" x2="628" y2="549" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="120" y="892" width="740" height="80" fill="#f9fafb" stroke="#d1d5db" rx="8"/>
  <text x="140" y="918" font-size="13" font-weight="bold" fill="#111827">提交之后</text>
  <text x="140" y="940" font-size="12" fill="#4b5563">S3 保留最近两代；引用感知 GC：标记 → 宽限期 → 复算可达性 → 清扫；离线审计器定期解密两份 manifest 验证全部 chunk 存在。</text>
  <text x="140" y="960" font-size="12" fill="#4b5563">final checkpoint 成功后进程组保持暂停，等待 AgentCore 回收会话。</text>
</svg>